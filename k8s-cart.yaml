---
# Kubernetes Deployment – cart-platform (Task 5)
# 2 replicas, image: nginx:alpine, label tier: cart
# Exposed via NodePort on 30083

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-deployment
  labels:
    app: cart
    tier: cart
spec:
  replicas: 2
  selector:
    matchLabels:
      tier: cart
  template:
    metadata:
      labels:
        app: cart
        tier: cart
    spec:
      containers:
        - name: cart-container
          image: nginx:alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  labels:
    tier: cart
spec:
  type: NodePort
  selector:
    tier: cart
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30083
